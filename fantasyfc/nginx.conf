server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space. Without this, a hard refresh on
    # /leagues/create asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever content changes, so they are
    # safe to cache indefinitely. index.html must never be cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
